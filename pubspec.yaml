name: ai_jyotish
description: Premium AI Astrology / AI Jyotish Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.10

  # UI & Design
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  lottie: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  glassmorphism_ui: ^0.3.0
  animated_text_kit: ^4.2.2
  card_swiper: ^3.0.1
  fl_chart: ^0.66.0
  percent_indicator: ^4.2.3
  flutter_rating_bar: ^4.0.1

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  flutter_facebook_auth: ^6.0.4

  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # AI & Chat
  dart_openai: ^4.0.0
  google_generative_ai: ^0.2.2

  # Voice
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5

  # Image
  image_picker: ^1.0.7
  image_cropper: ^5.0.1

  # Maps & Location
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  google_maps_flutter: ^2.5.3

  # Payment
  razorpay_flutter: ^1.3.6

  # Notifications
  flutter_local_notifications: ^16.3.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.2
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  path_provider: ^2.1.2
  permission_handler: ^11.1.0
  connectivity_plus: ^5.0.2
  flutter_native_splash: ^2.3.8
  flutter_launcher_icons: ^0.13.1

  # PDF
  pdf: ^3.10.7
  printing: ^5.12.0

  # Charts
  syncfusion_flutter_charts: ^24.1.41

  # Animations
  flutter_sequence_animation: ^4.0.0
  simple_animations: ^5.0.0+3
  particles_fly: ^0.0.3

  # Calendar
  table_calendar: ^3.0.9

  # Video
  video_player: ^2.8.2
  chewie: ^1.7.4

  # WebRTC
  flutter_webrtc: ^0.9.48
  agora_rtc_engine: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1
  retrofit_generator: ^8.0.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0A0A2E"
  adaptive_icon_foreground: "assets/images/app_icon_fg.png"

flutter_native_splash:
  color: "#0A0A2E"
  image: "assets/images/splash_logo.png"
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/fonts/
    - assets/zodiac/
    - assets/tarot/
    - assets/palm/
