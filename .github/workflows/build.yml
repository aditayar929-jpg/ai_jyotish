name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android/iOS structure
        run: flutter create --org com.aijyotish --project-name ai_jyotish --platforms android,ios .

      - name: Debug - print generated gradle files
        run: |
          echo "=== settings.gradle ===" && cat android/settings.gradle
          echo "=== build.gradle ===" && cat android/build.gradle
          echo "=== app/build.gradle ===" && cat android/app/build.gradle
          echo "=== gradle-wrapper.properties ===" && cat android/gradle/wrapper/gradle-wrapper.properties

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ai-jyotish-apk
          path: build/app/outputs/flutter-apk/app-release.apk
