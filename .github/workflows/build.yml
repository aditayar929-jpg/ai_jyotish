name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android/iOS structure
        run: flutter create --org com.aijyotish --project-name ai_jyotish --platforms android,ios .

      - name: Fix Gradle version and Flutter plugin setup
        run: |
          # Upgrade Gradle wrapper (flutter create generates 7.6.3, AGP needs 8.0+)
          sed -i 's|gradle-[0-9.]*-all\.zip|gradle-8.3-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties

          # Fix root build.gradle - ensure library plugins get Flutter extension
          cat > android/build.gradle << 'GRADLE'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          GRADLE

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ai-jyotish-apk
          path: build/app/outputs/flutter-apk/app-release.apk
