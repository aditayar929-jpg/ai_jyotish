name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android/iOS structure
        run: |
          flutter create --org com.aijyotish --project-name ai_jyotish --platforms android,ios temp_project
          cp -r temp_project/android android
          cp -r temp_project/ios ios
          rm -rf temp_project

      - name: Upgrade Gradle wrapper to 8.3
        run: |
          cd android
          sed -i 's|gradle-[0-9.]*-all.zip|gradle-8.3-all.zip|g' gradle/wrapper/gradle-wrapper.properties

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ai-jyotish-apk
          path: build/app/outputs/flutter-apk/app-release.apk
